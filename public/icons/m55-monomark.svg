<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <!-- Flat monomark derived from M55 core icon: green wheel + graphite hub/spokes (header/small UI) -->
  <circle cx="16" cy="16" r="15" fill="#2a6b52"/>
  <g stroke="#3a3d42" stroke-width="1.35" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="2"/>
    <line x1="16" y1="16" x2="16" y2="2" transform="rotate(60 16 16)"/>
    <line x1="16" y1="16" x2="16" y2="2" transform="rotate(120 16 16)"/>
    <line x1="16" y1="16" x2="16" y2="2" transform="rotate(180 16 16)"/>
    <line x1="16" y1="16" x2="16" y2="2" transform="rotate(240 16 16)"/>
    <line x1="16" y1="16" x2="16" y2="2" transform="rotate(300 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="5.25" fill="#3a3d42"/>
</svg>
