<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123B39" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#123B39" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0E6A70"/>
      <stop offset="55%" stop-color="#084E57"/>
      <stop offset="100%" stop-color="#062D34"/>
    </radialGradient>

    <linearGradient id="petalA" x1="128" y1="34" x2="128" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16D0C8"/>
      <stop offset="100%" stop-color="#0A6E67"/>
    </linearGradient>

    <linearGradient id="petalB" x1="128" y1="34" x2="128" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#63D99A"/>
      <stop offset="100%" stop-color="#0B7B57"/>
    </linearGradient>

    <linearGradient id="petalC" x1="128" y1="34" x2="128" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0FB09D"/>
      <stop offset="100%" stop-color="#084E4B"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#001518" flood-opacity="0.18"/>
    </filter>

    <path id="blade" d="M118 42
      Q128 30 138 42
      L144 86
      Q145 95 136 101
      Q128 106 120 101
      Q111 95 112 86
      Z" />
  </defs>

  <!-- optional subtle ambient glow -->
  <circle cx="128" cy="128" r="92" fill="url(#bgGlow)"/>

  <g filter="url(#shadow)">
    <g>
      <use href="#blade" fill="url(#petalA)"/>
    </g>
    <g transform="rotate(60 128 128)">
      <use href="#blade" fill="url(#petalB)"/>
    </g>
    <g transform="rotate(120 128 128)">
      <use href="#blade" fill="url(#petalC)"/>
    </g>
    <g transform="rotate(180 128 128)">
      <use href="#blade" fill="url(#petalA)"/>
    </g>
    <g transform="rotate(240 128 128)">
      <use href="#blade" fill="url(#petalB)"/>
    </g>
    <g transform="rotate(300 128 128)">
      <use href="#blade" fill="url(#petalC)"/>
    </g>

    <!-- center ring for structural finish -->
    <circle cx="128" cy="128" r="29" fill="#0A383E"/>
    <circle cx="128" cy="128" r="24" fill="url(#coreGrad)"/>
  </g>
</svg>