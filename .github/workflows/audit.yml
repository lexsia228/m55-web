name: m55-audit-gate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python guard deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/ci/guard/requirements.txt

      - name: Install deps (locked proof toolchain)
        run: npm ci

      - name: Audit gate
        run: npm run audit

      - name: M55 commercial SSOT verifier
        run: npm run verify:m55-ssot

      - name: M55 Asset-First Commercial SSOT
        run: npm run verify:m55-asset-ledger

      - name: M55 Premium Experience SSOT
        run: npm run verify:m55-premium-experience

      # Validates the committed execution records against the current source tree:
      # recomputes sourceSnapshotDigest, enforces the 12-state / 14-capture model
      # and the exact 42 PNG / 5 PDF evidence set, and rejects stale, handwritten
      # or source-mismatched records. Browser evidence is not regenerated here.
      - name: M55 Premium proof record authenticity
        run: npm run verify:m55-premium-proof-records

      - name: M55 Premium proof negative fixtures
        run: npm run test:premium-experience-verifier

      - name: M55 Experience Control Plane v2 enforcement
        run: npm run verify:m55-experience-control-plane

      # Static half of the responsive quality gate: governed viewports, protected
      # targets, CTA singularity and CI wiring. The measuring half runs in
      # e2e/commercial-visual-quality.spec.ts against a served build.
      - name: M55 commercial responsive quality gate
        run: npm run verify:m55-commercial-visual-quality

      - name: M55 commercial responsive quality broken fixtures
        run: npm run test:m55-commercial-visual-quality