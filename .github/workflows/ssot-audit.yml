name: M55 SSOT public audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ssot-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: SSOT public surface audit
        run: node scripts/run-sonnet-audit.js

      - name: ESLint SSOT public paths
        run: npm run lint:ssot